<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Lista de tareas</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 40px auto;
      padding: 15px;
    }
    input, button { padding: 8px; }
    li { margin: 12px 0; }
    .completada { text-decoration: line-through; color: gray; }
    .error { color: red; }
  </style>
</head>
<body>
  <h1 id="titulo">Lista</h1>

  <form id="formTarea">
    <input id="nombreTarea" type="text" placeholder="Escribe una tarea">
    <button type="submit">Agregar</button>
  </form>

  <p id="mensaje"></p>
  <p id="vistaPrevia"></p>
  <ul id="listaTareas"></ul>
  <p id="resumen"></p>

  <script src="app.js"></script>
</body>
</html>
